<!DOCTYPE html>

<!-- zoomschutz:anfang – verhindert, dass iPad/iPhone ins Spiel hineinzoomen (Doppeltipp, Zwei-Finger, Eingabefeld) -->
<style>
  html,body,*{touch-action:manipulation}
  html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  input,textarea,select,[contenteditable]:not([contenteditable="false"]){-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
<script>
(function(){
  var d = document;
  var feld = function(el){ return el && el.closest && el.closest('input,textarea,select,label,[contenteditable]:not([contenteditable="false"])'); };
  // Safari: Zwei-Finger-Zoom (Pinch) abbrechen
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    d.addEventListener(n, function(e){ e.preventDefault(); }, { passive:false });
  });
  // Zweiter Finger auf dem Bildschirm: Safari darf daraus keinen Zoom machen (Spiel-Events kommen trotzdem an)
  d.addEventListener('touchstart', function(e){
    if (e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive:false });
  d.addEventListener('touchmove', function(e){
    if (e.cancelable && (e.touches.length > 1 || (typeof e.scale === 'number' && e.scale !== 1))) e.preventDefault();
  }, { passive:false });
  // Doppeltipp: den zweiten schnellen Tipp nicht an Safari weitergeben (sonst Zoom),
  // den Klick dafür selbst auslösen, damit Knöpfe weiter auf jeden Tipp reagieren
  var letzterTipp = 0;
  d.addEventListener('touchend', function(e){
    var jetzt = Date.now(), schnell = jetzt - letzterTipp < 400;
    letzterTipp = jetzt;
    if (!schnell || !e.cancelable || e.defaultPrevented || feld(e.target)) return;
    e.preventDefault();
    var t = e.changedTouches && e.changedTouches[0];
    if (t && e.target && e.target.dispatchEvent) e.target.dispatchEvent(new MouseEvent('click', {
      bubbles:true, cancelable:true, view:window,
      clientX:t.clientX, clientY:t.clientY, screenX:t.screenX, screenY:t.screenY
    }));
  }, { passive:false });
  // Falls trotzdem gezoomt wurde: sofort auf 100 % zurück
  var vv = window.visualViewport, meta = d.querySelector('meta[name="viewport"]');
  if (vv && meta){
    var basis = meta.getAttribute('content'), wechsel = false, laeuft = false;
    var zurueck = function(){
      if (laeuft || vv.scale <= 1.01) return;
      if (feld(d.activeElement)) return;
      laeuft = true;
      setTimeout(function(){
        wechsel = !wechsel;
        meta.setAttribute('content', basis + (wechsel ? ', minimum-scale=1' : ''));
        laeuft = false;
      }, 60);
    };
    vv.addEventListener('resize', zurueck);
    d.addEventListener('touchend', function(e){ if (!e.touches.length) zurueck(); }, { passive:true });
    d.addEventListener('focusout', function(){ setTimeout(zurueck, 300); });
  }
})();
</script>
<!-- zoomschutz:ende -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Fischfieber">
<title>Fischfieber</title>
<style>
  @font-face{font-family:Barlow;src:url(/vendor/barlow-semi-condensed-600.woff2) format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:Barlow;src:url(/vendor/barlow-semi-condensed-700.woff2) format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:Barlow;src:url(/vendor/barlow-semi-condensed-800.woff2) format('woff2');font-weight:800;font-display:swap}
  :root{--gelb:#ffcc33;--rot:#ff5a4e;--gruen:#3ccf7a;--blau:#2a8fd6;--tinte:#0b2b45;--panel:rgba(10,32,52,.94);--rand:#2f6f9e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b2b45;color:#fff;font-family:Barlow,system-ui,sans-serif;font-weight:600;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;pointer-events:none;z-index:5}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;background:var(--gelb);color:var(--tinte);cursor:pointer;box-shadow:0 3px 0 #b88a12;pointer-events:auto}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a12}
  button:disabled{background:#56606b;color:#c9d1d9;box-shadow:0 3px 0 #333b44;cursor:default}
  button.zweit{background:#2f6f9e;color:#fff;box-shadow:0 3px 0 #1b4566}
  button.gefahr{background:var(--rot);color:#fff;box-shadow:0 3px 0 #a5302a}
  button.gruen{background:var(--gruen);color:#06301a;box-shadow:0 3px 0 #1f8a4d}

  /* HUD */
  #hud{inset:0;display:none}
  #oben{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:6px}
  .chip{background:rgba(6,24,40,.7);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;width:max-content}
  #geld{color:var(--gelb)} #geld.minus{color:var(--rot)}
  #hpRahmen{width:200px;height:14px;background:rgba(6,24,40,.7);border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
  #hpBalken{height:100%;width:100%;background:linear-gradient(90deg,#ff5a4e,#ff9a4e);transition:width .15s}
  #inselName{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));text-align:right;font-size:15px;opacity:.85}
  #mitspieler{position:absolute;top:calc(38px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:none;background:rgba(6,24,40,.62);border-radius:10px;padding:6px 10px;font-size:15px;text-align:right;max-width:min(300px,46vw)}
  #mitspieler .code{font-size:12px;opacity:.7;letter-spacing:1px}
  #mitspieler div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mitspieler i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  #mitspieler small{opacity:.7}
  #mitspieler .hp{opacity:.85;font-size:13px}
  body.touch #mitspieler{top:calc(58px + env(safe-area-inset-top));right:calc(64px + env(safe-area-inset-right));font-size:13px}
  #fadenkreuz{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
  #fadenkreuz:before,#fadenkreuz:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
  #fadenkreuz:before{left:10px;top:3px;width:2px;height:16px}
  #fadenkreuz:after{top:10px;left:3px;height:2px;width:16px}
  #hinweis{position:absolute;left:50%;top:60%;transform:translateX(-50%);background:rgba(6,24,40,.78);padding:8px 16px;border-radius:10px;font-size:19px;display:none;white-space:nowrap}
  #hinweis b{color:var(--gelb)}
  #angel{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);text-align:center;display:none;width:min(420px,86vw)}
  #angelText{font-size:22px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.6);margin-bottom:6px}
  #angelText.biss{color:var(--gelb);font-size:42px;animation:puls .25s infinite alternate}
  @keyframes puls{from{transform:scale(1)}to{transform:scale(1.12)}}
  .leiste{height:16px;background:rgba(6,24,40,.75);border-radius:9px;overflow:hidden;border:2px solid rgba(255,255,255,.3);margin-top:5px}
  .leiste>div{height:100%;width:0}
  #spannung>div{background:linear-gradient(90deg,#3ccf7a,#ffcc33 60%,#ff5a4e)}
  #ladung>div{background:linear-gradient(90deg,#9fd8ff,#ffcc33)}
  #entf{font-size:15px;opacity:.85;margin-top:4px}
  #hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px}
  .slot{width:64px;height:64px;border-radius:12px;background:rgba(6,24,40,.72);border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;position:relative;pointer-events:auto;cursor:pointer}
  .slot.an{border-color:var(--gelb);background:rgba(40,60,20,.75);transform:translateY(-4px)}
  .slot small{font-size:11px;opacity:.85;font-weight:700}
  .slot i{position:absolute;top:2px;left:6px;font-size:11px;font-style:normal;opacity:.6}
  #munition{position:absolute;right:16px;bottom:18px;font-size:30px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  #meldungen{position:absolute;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
  .meldung{background:rgba(6,24,40,.8);padding:6px 14px;border-radius:9px;font-size:18px;animation:rein .2s ease-out;transition:opacity .4s}
  @keyframes rein{from{transform:translateY(-8px);opacity:0}}
  #ansage{position:absolute;top:32%;left:0;right:0;text-align:center;font-size:clamp(34px,7vw,72px);font-weight:800;color:var(--gelb);text-shadow:0 4px 0 #7a4d00,0 8px 20px rgba(0,0,0,.5);opacity:0;transition:opacity .4s}
  #ansage small{display:block;font-size:.4em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #bossbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(520px,60vw);display:none;text-align:center}
  #bossbar .name{font-size:20px;font-weight:800;color:#ffb3ad;text-shadow:0 2px 4px #000}
  #bossbar .leiste>div{background:linear-gradient(90deg,#b81f1f,#ff5a4e)}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,20,40,.32) 100%)}
  #aua{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(255,0,0,.75);opacity:0;transition:opacity .25s;z-index:4}
  #zahlen{inset:0}
  .zahl{position:absolute;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;transform:translate(-50%,-50%);white-space:nowrap}
  #schwarz{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:30}

  /* Panels */
  .huelle{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,14,26,.55);z-index:20;padding:16px}
  .panel{background:var(--panel);border:2px solid var(--rand);border-radius:18px;width:min(720px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);pointer-events:auto;touch-action:pan-y}
  .panel h2{margin:0 0 4px;font-size:28px;font-weight:800;color:var(--gelb)}
  .panel .unter{opacity:.8;margin:0 0 12px}
  .kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .zu{background:transparent;color:#fff;box-shadow:none;font-size:26px;padding:0 6px;line-height:1}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .tabs button{background:#16405f;color:#fff;box-shadow:none;padding:7px 12px}
  .tabs button.an{background:var(--gelb);color:var(--tinte)}
  .zeile{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:6px}
  .zeile .icon{font-size:28px;width:38px;text-align:center}
  .zeile .mitte{flex:1;min-width:0}
  .zeile .mitte b{display:block;font-size:18px}
  .zeile .mitte span{font-size:14px;opacity:.75}
  .preis{color:var(--gelb);font-weight:800;white-space:nowrap}
  .summe{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:20px;font-weight:800}
  .rede{background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.45;margin-bottom:12px}
  .rede b{color:var(--gelb)}
  .knoepfe{display:flex;gap:8px;flex-wrap:wrap}
  .gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .karte{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;text-align:center;border:2px solid transparent}
  .karte .gross{font-size:34px}
  .karte.unbekannt{opacity:.45;filter:grayscale(1)}
  .karte b{display:block}
  .karte span{font-size:13px;opacity:.8}
  #menue .panel{text-align:center;width:min(520px,100%)}
  #titel{font-size:clamp(46px,10vw,88px);font-weight:800;color:var(--gelb);margin:0;line-height:.95;text-shadow:0 5px 0 #b56a00,0 10px 30px rgba(0,0,0,.4);letter-spacing:1px}
  #menue .knoepfe{flex-direction:column;align-items:stretch;margin-top:18px}
  #menue button{font-size:20px;padding:12px}
  .klein{font-size:13px;opacity:.65;margin-top:14px}
  .klein a{color:#9fd8ff}
  .tasten{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;font-size:16px;margin:10px 0}
  .tasten kbd{background:#16405f;border-radius:6px;padding:1px 8px;font-family:inherit;font-weight:800;color:var(--gelb);white-space:nowrap}
  .einst{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:18px}
  input[type=range]{width:180px;accent-color:var(--gelb)}
  .feld{font:inherit;font-weight:700;font-size:17px;padding:8px 10px;border-radius:9px;border:2px solid var(--rand);background:#0b2b45;color:#fff;width:min(240px,55vw);pointer-events:auto}
  .feld:focus{outline:none;border-color:var(--gelb)}
  .mpFehler{color:#ff8a80;margin:6px 0}
  .mpCodeGross{color:var(--gelb);font-size:1.3em;letter-spacing:2px}
  .punkt{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}

  /* Casino */
  .casino{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .casino>div{background:rgba(255,255,255,.05);border-radius:14px;padding:12px;text-align:center}
  .casino h3{margin:0 0 8px;font-size:20px}
  #radCv{width:100%;max-width:220px;aspect-ratio:1}
  .walzen{display:flex;justify-content:center;gap:8px;margin:20px 0}
  .walze{width:62px;height:76px;background:#fff;border-radius:10px;color:#000;font-size:44px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
  .einsatz{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .einsatz button{padding:5px 9px;font-size:15px;background:#16405f;color:#fff;box-shadow:none}
  .einsatz button.an{background:var(--gelb);color:var(--tinte)}
  #casinoErgebnis{text-align:center;font-size:22px;font-weight:800;min-height:30px;margin-top:10px}

  /* Touch */
  #touch{position:fixed;inset:0;z-index:3;display:none;touch-action:none}
  .tknopf{position:absolute;border-radius:50%;background:rgba(6,24,40,.55);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;pointer-events:auto}
  .tknopf.an{background:rgba(255,204,51,.6)}
  #touch{--r:env(safe-area-inset-right);--u:env(safe-area-inset-bottom)}
  #tHaupt{width:96px;height:96px;right:calc(22px + var(--r));bottom:calc(110px + var(--u));font-size:16px}
  #tSprung{width:64px;height:64px;right:calc(130px + var(--r));bottom:calc(96px + var(--u))}
  #tAktion{width:64px;height:64px;right:calc(40px + var(--r));bottom:calc(222px + var(--u));display:none;background:rgba(255,204,51,.55)}
  #tLaden{width:52px;height:52px;right:calc(136px + var(--r));bottom:calc(176px + var(--u))}
  #tPause{width:44px;height:44px;right:calc(12px + var(--r));top:calc(58px + env(safe-area-inset-top));border-radius:12px}
  #stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(6,24,40,.3);display:none;transform:translate(-50%,-50%)}
  #stick div{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);transform:translate(-50%,-50%)}
  body.touch .slot{width:52px;height:52px;font-size:22px}
  body.touch #hotbar{bottom:calc(8px + env(safe-area-inset-bottom));left:50%}
  body.touch #angel{bottom:calc(80px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));transform:none;width:min(52vw,320px);text-align:left}
  body.touch #angelText{font-size:17px}
  body.touch #angelText.biss{font-size:30px}
  body.touch #entf{font-size:13px}
  body.touch #munition{bottom:auto;top:110px;right:14px;font-size:22px}
  /* Handy quer: wenig Höhe */
  @media (max-height:460px){body.touch #tHaupt{width:84px;height:84px;bottom:calc(70px + var(--u))}body.touch #tSprung{bottom:calc(60px + var(--u))}body.touch #tLaden{bottom:calc(130px + var(--u))}body.touch #tAktion{bottom:calc(166px + var(--u))}body.touch #angel{bottom:calc(66px + env(safe-area-inset-bottom))}.chip{font-size:15px;padding:4px 10px}#oben{gap:4px}body.touch .slot{width:46px;height:46px;font-size:19px}body.touch .slot small{display:none}}
  @media (max-width:640px){.casino{grid-template-columns:1fr}.chip{font-size:17px}#hpRahmen{width:150px}}
</style>
</head>

  <div id="munition"></div>
</div>

<div class="huelle" id="menue"><div class="panel">
