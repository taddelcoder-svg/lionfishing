<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- zoomschutz:anfang – verhindert, dass iPad/iPhone ins Spiel hineinzoomen (Doppeltipp, Zwei-Finger, Eingabefeld) -->
<style>
  html,body,*{touch-action:manipulation}
  html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  input,textarea,select,[contenteditable]:not([contenteditable="false"]){-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
<script>
(function(){
  var d = document;
  var feld = function(el){ return el && el.closest && el.closest('input,textarea,select,label,[contenteditable]:not([contenteditable="false"])'); };
  // Safari: Zwei-Finger-Zoom (Pinch) abbrechen
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){
    d.addEventListener(n, function(e){ e.preventDefault(); }, { passive:false });
  });
  // Zweiter Finger auf dem Bildschirm: Safari darf daraus keinen Zoom machen (Spiel-Events kommen trotzdem an)
  d.addEventListener('touchstart', function(e){
    if (e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive:false });
  d.addEventListener('touchmove', function(e){
    if (e.cancelable && (e.touches.length > 1 || (typeof e.scale === 'number' && e.scale !== 1))) e.preventDefault();
  }, { passive:false });
  // Doppeltipp: den zweiten schnellen Tipp nicht an Safari weitergeben (sonst Zoom),
  // den Klick dafür selbst auslösen, damit Knöpfe weiter auf jeden Tipp reagieren
  var letzterTipp = 0;
  d.addEventListener('touchend', function(e){
    var jetzt = Date.now(), schnell = jetzt - letzterTipp < 400;
    letzterTipp = jetzt;
    if (!schnell || !e.cancelable || e.defaultPrevented || feld(e.target)) return;
    e.preventDefault();
    var t = e.changedTouches && e.changedTouches[0];
    if (t && e.target && e.target.dispatchEvent) e.target.dispatchEvent(new MouseEvent('click', {
      bubbles:true, cancelable:true, view:window,
      clientX:t.clientX, clientY:t.clientY, screenX:t.screenX, screenY:t.screenY
    }));
  }, { passive:false });
  // Falls trotzdem gezoomt wurde: sofort auf 100 % zurück
  var vv = window.visualViewport, meta = d.querySelector('meta[name="viewport"]');
  if (vv && meta){
    var basis = meta.getAttribute('content'), wechsel = false, laeuft = false;
    var zurueck = function(){
      if (laeuft || vv.scale <= 1.01) return;
      if (feld(d.activeElement)) return;
      laeuft = true;
      setTimeout(function(){
        wechsel = !wechsel;
        meta.setAttribute('content', basis + (wechsel ? ', minimum-scale=1' : ''));
        laeuft = false;
      }, 60);
    };
    vv.addEventListener('resize', zurueck);
    d.addEventListener('touchend', function(e){ if (!e.touches.length) zurueck(); }, { passive:true });
    d.addEventListener('focusout', function(){ setTimeout(zurueck, 300); });
  }
})();
</script>

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fischfieber">
<title>Fischfieber</title>
<style>
  @font-face{font-family:"Bricolage Grotesque";src:url(/vendor/bricolage-grotesque.woff2) format('woff2');font-weight:200 800;font-style:normal;font-display:swap}
  :root{
    /* Farb-Tokens: Meer und Sonne */
    --flaeche:#071d30; --flaeche-2:#0d2d47; --karte:rgba(9,31,50,.9); --karte-fest:#0c2a43; --karte-hell:rgba(255,255,255,.06);
    --text:#f3f9fd; --text-weich:#b4cbdb; --rand:rgba(160,210,240,.22); --rand-stark:rgba(160,210,240,.4);
    --akzent:#ffcc33; --akzent-dunkel:#b07c00; --akzent-2:#2ec4d6; --erfolg:#3ccf7a; --warnung:#ffb020; --gefahr:#ff5a4e; --gefahr-dunkel:#d93a2f;
    --chip:rgba(6,22,37,.8); --tinte:#0b2b45;
    --r-karte:18px; --r-mittel:12px; --r-klein:10px;
    --schatten:0 1px 0 rgba(255,255,255,.07) inset,0 2px 4px rgba(0,0,0,.28),0 14px 36px rgba(0,0,0,.4);
    --schrift:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
    /* alte Namen, die das Spiel in Texten benutzt */
    --gelb:var(--akzent); --rot:var(--gefahr); --gruen:var(--erfolg); --blau:#2a8fd6; --panel:var(--karte); 
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--flaeche);color:var(--text);font-family:var(--schrift);font-weight:500;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;pointer-events:none;z-index:5}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--akzent-2);outline-offset:2px}

  /* Knöpfe: Primär (gelb), Erfolg (grün), Sekundär (zweit), Gefahr */
  button{font:inherit;font-weight:700;font-size:16px;line-height:1.15;border:0;border-radius:var(--r-mittel);min-height:44px;padding:10px 16px;background:linear-gradient(180deg,#ffd957,#ffbf1f);color:var(--tinte);cursor:pointer;box-shadow:0 3px 0 var(--akzent-dunkel),0 6px 14px rgba(0,0,0,.25);pointer-events:auto;transition:transform .08s,box-shadow .08s,filter .15s,background .15s}
  button:hover{filter:brightness(1.07)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--akzent-dunkel),0 2px 6px rgba(0,0,0,.25)}
  button:disabled{background:#3a4a58;color:#b9c6d1;box-shadow:0 3px 0 #27323c;cursor:default;filter:none}
  button:disabled:active{transform:none;box-shadow:0 3px 0 #27323c}
  button.zweit{background:linear-gradient(180deg,#2b6f9e,#235c85);color:#fff;box-shadow:0 3px 0 #153f5c,0 6px 14px rgba(0,0,0,.25);border:1px solid rgba(160,210,240,.28)}
  button.zweit:active{box-shadow:0 1px 0 #153f5c}
  button.zweit:disabled{background:#33434f;color:#b9c6d1;border-color:transparent;box-shadow:0 3px 0 #27323c}
  button.gefahr{background:linear-gradient(180deg,#ee5246,var(--gefahr-dunkel));color:#fff;box-shadow:0 3px 0 #8f241c,0 6px 14px rgba(0,0,0,.25)}
  button.gefahr:active{box-shadow:0 1px 0 #8f241c}
  button.gruen{background:linear-gradient(180deg,#52e08c,#2fbd6b);color:#04301a;box-shadow:0 3px 0 #1a7d46,0 6px 14px rgba(0,0,0,.25)}
  button.gruen:active{box-shadow:0 1px 0 #1a7d46}
  button.gruen:disabled{background:#3a4a58;color:#b9c6d1;box-shadow:0 3px 0 #27323c}

  /* HUD: Chips mit dunklem, leicht durchsichtigem Grund (kein Blur, damit es auf dem Handy flüssig bleibt) */
  #hud{inset:0;display:none}
  #oben{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--rand);border-radius:var(--r-mittel);padding:5px 12px 5px 9px;font-size:20px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:7px;width:max-content;box-shadow:0 4px 14px rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
  .chip .ic{font-size:18px}
  .chip.klein{font-size:14px;font-weight:700;padding:4px 10px;color:var(--text-weich);gap:6px}
  .chip.klein b{color:var(--text);font-weight:700}
  #geld{color:var(--akzent)} #geld.minus{color:#ff8a80}
  #kiste.voll{color:#ffb3ad}
  .lebenskarte{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--rand);border-radius:var(--r-mittel);padding:5px 12px 5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
  .lebenskarte .ic{font-size:16px}
  #hpZahl{font-size:15px;font-weight:800;min-width:2.2em;text-align:right}
  #hpRahmen{width:150px;height:12px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
  #hpBalken{height:100%;width:100%;background:linear-gradient(90deg,#3ccf7a,#9be35a);border-radius:8px;transition:width .15s,background .3s}
  #hpRahmen.mittel #hpBalken{background:linear-gradient(90deg,#ffb020,#ffd957)}
  #hpRahmen.niedrig #hpBalken{background:linear-gradient(90deg,#d93a2f,#ff7b4e)}
  #hpRahmen.niedrig{animation:herz 1s infinite}
  @keyframes herz{50%{box-shadow:0 0 0 3px rgba(255,90,78,.45)}}
  #inselName:empty{display:none}
  #inselName{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));text-align:right;font-size:14px;font-weight:700;background:var(--chip);border:1px solid var(--rand);padding:6px 12px;border-radius:var(--r-mittel);box-shadow:0 4px 14px rgba(0,0,0,.28)}
  #mitspieler{position:absolute;top:calc(52px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:none;background:var(--chip);border:1px solid var(--rand);border-radius:var(--r-mittel);padding:8px 12px;font-size:14px;text-align:right;max-width:min(300px,46vw);box-shadow:0 4px 14px rgba(0,0,0,.28)}
  #mitspieler .code{font-size:12px;color:var(--text-weich);letter-spacing:1.5px;margin-bottom:2px}
  #mitspieler div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mitspieler i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  #mitspieler small{color:var(--text-weich)}
  #mitspieler .hp{color:var(--text-weich);font-size:13px}
  body.touch #mitspieler{top:calc(58px + env(safe-area-inset-top));right:calc(64px + env(safe-area-inset-right));font-size:13px}
  #fadenkreuz{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
  #fadenkreuz:before,#fadenkreuz:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.9)}
  #fadenkreuz:before{left:10px;top:3px;width:2px;height:16px}
  #fadenkreuz:after{top:10px;left:3px;height:2px;width:16px}
  #hinweis{position:absolute;left:50%;top:60%;transform:translateX(-50%);background:var(--chip);border:1px solid var(--rand);padding:8px 16px;border-radius:999px;font-size:18px;font-weight:700;display:none;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  #hinweis b{display:inline-block;min-width:1.7em;text-align:center;background:var(--akzent);color:var(--tinte);border-radius:7px;padding:0 6px;margin-right:6px;font-weight:800}
  /* Angeln: Wurfkraft, Biss, Drill */
  #angel{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);text-align:center;display:none;width:min(440px,90vw);background:var(--chip);border:1px solid var(--rand);border-radius:var(--r-karte);padding:10px 16px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #angel.klein{width:auto;max-width:90vw;padding:7px 18px 8px;border-radius:999px}
  #angel.klein #angelText{font-size:16px;margin-bottom:0}
  #angel.klein #entf{margin-top:0;font-size:13px}
  #angelText{font-size:20px;font-weight:800;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  #angelText.biss{color:var(--akzent);font-size:40px;animation:puls .25s infinite alternate}
  #angel.zieht{border-color:rgba(255,90,78,.75);animation:zieht .3s infinite alternate}
  @keyframes puls{from{transform:scale(1)}to{transform:scale(1.1)}}
  @keyframes zieht{from{transform:translateX(-50%) translateX(-2px)}to{transform:translateX(-50%) translateX(2px)}}
  .leiste{position:relative;height:18px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden;margin-top:6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
  .leiste>div:first-child{height:100%;width:0;border-radius:10px}
  #spannung>div:first-child{background:linear-gradient(90deg,#3ccf7a,#ffcc33 62%,#ff5a4e);background-repeat:no-repeat}
  #spannung .marke{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
  #spannung .marke.m1{left:62%} #spannung .marke.m2{left:85%;background:rgba(255,120,110,.95)}
  #spannung.heiss{box-shadow:0 0 0 2px var(--gefahr),0 0 14px rgba(255,90,78,.8);animation:herz .35s infinite}
  #ladung>div:first-child{background:linear-gradient(90deg,#9fd8ff,#ffcc33)}
  #distLeiste{height:8px;margin-top:8px}
  #distLeiste>div:first-child{background:linear-gradient(90deg,#ff8a80,#ffcc33 40%,#3ccf7a)}
  #entf{font-size:14px;font-weight:600;color:var(--text-weich);margin-top:6px}
  .leistenKopf{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text-weich);margin-top:6px;letter-spacing:.4px;text-transform:uppercase}
  #hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:var(--chip);border:1px solid var(--rand);border-radius:var(--r-karte);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .slot{width:62px;height:62px;border-radius:var(--r-mittel);background:rgba(255,255,255,.07);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;position:relative;pointer-events:auto;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
  .slot.an{border-color:var(--akzent);background:rgba(255,204,51,.16);transform:translateY(-4px);box-shadow:0 6px 14px rgba(0,0,0,.35)}
  .slot small{font-size:11px;color:var(--text-weich);font-weight:700;line-height:1}
  .slot.an small{color:var(--text)}
  .slot i{position:absolute;top:2px;left:6px;font-size:11px;font-style:normal;font-weight:800;color:var(--text-weich)}
  #munition{position:absolute;right:16px;bottom:22px;font-size:26px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #munition:not(:empty){background:var(--chip);border:1px solid var(--rand);border-radius:var(--r-mittel);padding:4px 12px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
  #meldungen{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(92vw,520px)}
  .meldung{background:var(--chip);border:1px solid var(--rand);padding:6px 14px;border-radius:999px;font-size:17px;font-weight:600;animation:rein .2s ease-out;transition:opacity .4s;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  @keyframes rein{from{transform:translateY(-8px);opacity:0}}
  #ansage{position:absolute;top:30%;left:0;right:0;text-align:center;padding:0 16px;font-size:clamp(32px,7vw,68px);font-weight:800;line-height:1.05;color:var(--akzent);text-shadow:0 4px 0 #7a4d00,0 8px 24px rgba(0,0,0,.55);opacity:0;transition:opacity .4s}
  #ansage small{display:block;width:max-content;max-width:92vw;margin:10px auto 0;font-size:max(16px,.34em);font-weight:700;color:#fff;background:var(--chip);border:1px solid var(--rand);padding:5px 16px;border-radius:999px;text-shadow:none}
  #bossbar{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,52vw);display:none;text-align:center}
  #bossbar .name{font-size:19px;font-weight:800;color:#ffd0cb;text-shadow:0 2px 6px #000}
  #bossbar .leiste>div:first-child{background:linear-gradient(90deg,#b81f1f,#ff5a4e)}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,20,40,.3) 100%)}
  #aua{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(255,0,0,.75);opacity:0;transition:opacity .25s;z-index:4}
  #zahlen{inset:0}
  .zahl{position:absolute;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;transform:translate(-50%,-50%);white-space:nowrap}
  #schwarz{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:30}
  /* Olympiade: Zeit oben in der Mitte, Countdown */
  #olympZeit{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;background:var(--chip);border:1px solid var(--rand-stark);border-radius:var(--r-mittel);padding:4px 18px 5px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #olympZeit small{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--akzent);text-transform:uppercase}
  #olympZeitText{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  #olympZeit.knapp #olympZeitText{color:#ff8a80;animation:puls .5s infinite alternate}
  #countdown{inset:0;display:none;align-items:center;justify-content:center;z-index:25;flex-direction:column;gap:6px;background:rgba(3,14,26,.35)}
  #countdown b{font-size:clamp(96px,26vw,220px);font-weight:800;line-height:1;color:var(--akzent);text-shadow:0 6px 0 #7a4d00,0 12px 36px rgba(0,0,0,.55);animation:puls .5s ease-out}
  #countdown span{font-size:20px;font-weight:700;background:var(--chip);border:1px solid var(--rand);padding:6px 18px;border-radius:999px}

  /* Fenster und Karten */
  .huelle{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(5,24,41,.45),rgba(3,12,22,.78));z-index:20;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .panel{position:relative;background:linear-gradient(180deg,rgba(14,42,66,.96),var(--karte));border:1px solid var(--rand-stark);border-radius:20px;width:min(720px,100%);max-height:100%;overflow:auto;padding:20px 22px 22px;box-shadow:var(--schatten);pointer-events:auto;touch-action:pan-y;animation:panelRein .22s ease-out;overscroll-behavior:contain}
  @keyframes panelRein{from{opacity:0;transform:translateY(10px) scale(.98)}}
  .panel h2{margin:0 0 4px;font-size:28px;line-height:1.1;font-weight:800;color:var(--akzent);letter-spacing:-.2px}
  .panel h3{margin:0 0 8px;font-size:19px;font-weight:800}
  .panel .unter{color:var(--text-weich);margin:0 0 12px;font-size:16px;font-weight:500;line-height:1.4}
  .kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .zu{background:rgba(255,255,255,.09);color:var(--text);box-shadow:none;font-size:20px;width:44px;min-width:44px;height:44px;padding:0;border-radius:50%;line-height:1;border:1px solid var(--rand);flex:none}
  .zu:hover{background:rgba(255,255,255,.16);filter:none}
  .zu:active{box-shadow:none}
  .geldchip{display:inline-block;background:rgba(255,204,51,.14);border:1px solid rgba(255,204,51,.4);color:var(--akzent);border-radius:999px;padding:1px 10px;font-weight:800}
  .geldchip.minus{color:#ff8a80;background:rgba(255,90,78,.14);border-color:rgba(255,90,78,.45)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px;padding:4px;background:rgba(0,0,0,.25);border-radius:14px}
  .tabs button{flex:1 1 auto;background:transparent;color:var(--text-weich);box-shadow:none;padding:8px 12px;font-size:15px;border-radius:10px;min-height:44px}
  .tabs button:hover{background:rgba(255,255,255,.08);filter:none}
  .tabs button.an{background:var(--akzent);color:var(--tinte)}
  .zeile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--karte-hell);border:1px solid rgba(160,210,240,.12);margin-bottom:8px;border-left:4px solid var(--sel,rgba(160,210,240,.12))}
  .zeile .icon{font-size:26px;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
  .zeile .mitte{flex:1;min-width:0}
  .zeile .mitte b{display:block;font-size:17px;font-weight:700;line-height:1.2}
  .zeile .mitte span{font-size:14px;color:var(--text-weich);line-height:1.35;display:block}
  .zeile>button,.zeile>.preis,.zeile>.badge{flex:none}
  .preis{color:var(--akzent);font-weight:800;white-space:nowrap;font-size:16px}
  .preis.knapp{color:#ff9d94}
  .badge{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:var(--r-mittel);background:rgba(60,207,122,.14);border:1px solid rgba(60,207,122,.4);color:#7ae6a6;font-weight:700;font-size:14px;white-space:nowrap}

  }

<script>
// Goodnotes-Knopf – in allen Spielen gleich (Vorlage: spielesammlung).
// Kleiner, halbtransparenter Knopf nur auf iPad/iPhone/Mac, öffnet die Goodnotes-App.
// Verschieben: Knopf ziehen (Platz wird gemerkt). Tastenkürzel: Ctrl+Shift+G oder Alt+G.
(function(){
  var ua = navigator.userAgent;
  var apple = /iPad|iPhone|iPod/.test(ua) || /Macintosh/.test(ua);
  if (!apple) return;
  var ZIEL = 'goodnotes://';
  function oeffnen(){
    try { window.top.location.href = ZIEL; } catch (e) { location.href = ZIEL; }
  }
  document.addEventListener('keydown', function(e){
    if (e.code === 'KeyG' && ((e.ctrlKey && e.shiftKey) || (e.altKey && !e.ctrlKey && !e.metaKey))){
      e.preventDefault(); e.stopPropagation(); oeffnen();
    }
  }, true);
  if ((navigator.maxTouchPoints || 0) < 1) return;   // Knopf nur auf Touch-Geräten
  function bauen(){
    var k = document.createElement('div');
    k.setAttribute('role', 'button');
    k.setAttribute('aria-label', 'Goodnotes öffnen');
    k.title = 'Goodnotes öffnen';
    k.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    k.style.cssText = 'position:fixed;z-index:2147483647;width:32px;height:32px;border-radius:50%;'
      + 'display:flex;align-items:center;justify-content:center;background:rgba(20,20,30,.55);color:#fff;'
      + 'opacity:.3;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;'
      + 'transition:opacity .2s;cursor:pointer;-webkit-tap-highlight-color:transparent';
    var pos = null;
    try { pos = JSON.parse(localStorage.getItem('goodnotes_knopf')); } catch (e) {}
    function setzen(x, y){
      x = Math.max(0, Math.min(innerWidth - 32, x)); y = Math.max(0, Math.min(innerHeight - 32, y));
      k.style.left = x + 'px'; k.style.top = y + 'px';
    }
    function platzieren(){
      if (pos) setzen(pos.x * innerWidth, pos.y * innerHeight);
      else { k.style.left = 'calc(env(safe-area-inset-left) + 6px)'; k.style.top = 'calc(50% - 16px)'; }
    }
    platzieren();
    addEventListener('resize', platzieren);
    var start = null, gezogen = false;
    function stopp(e){ e.stopPropagation(); }
    k.addEventListener('touchstart', stopp, { passive:true });
    k.addEventListener('touchmove', function(e){ e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive:false });
    k.addEventListener('touchend', function(e){ e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive:false });
    k.addEventListener('pointerdown', function(e){
      e.stopPropagation(); e.preventDefault();
      var r = k.getBoundingClientRect();
      start = { x:e.clientX, y:e.clientY, dx:e.clientX - r.left, dy:e.clientY - r.top }; gezogen = false;
      k.style.opacity = '.9';
      try { k.setPointerCapture(e.pointerId); } catch (f) {}
    });
    k.addEventListener('pointermove', function(e){
      if (!start) return;
      e.stopPropagation();
      if (!gezogen && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 10) return;
      gezogen = true;
      setzen(e.clientX - start.dx, e.clientY - start.dy);
    });
    function ende(e){
      if (!start) return;
      e.stopPropagation(); start = null; k.style.opacity = '.3';
      if (gezogen){
        var r = k.getBoundingClientRect();
        pos = { x:r.left / innerWidth, y:r.top / innerHeight };
        try { localStorage.setItem('goodnotes_knopf', JSON.stringify(pos)); } catch (f) {}
      } else if (e.type === 'pointerup') oeffnen();
    }
    k.addEventListener('pointerup', ende);
    k.addEventListener('pointercancel', ende);
    k.addEventListener('click', stopp);
    k.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    document.body.appendChild(k);
  }
  if (document.body) bauen(); else document.addEventListener('DOMContentLoaded', bauen);
})();
</script>
